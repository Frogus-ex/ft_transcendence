global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # À activer une fois que le backend expose /metrics (ex: via prometheus-fastapi-instrumentator)
  # - job_name: 'backend'
  #   static_configs:
  #     - targets: ['backend:8000']