  redis:                                          # ← nouveau service, même indentation que "db:"
    image: docker.io/library/redis:7-alpine
    container_name: transcendence_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - transcendence_net

  data-pipeline:
    build:
      context: ./backend/data-ingestion/src
      dockerfile: Dockerfile
    container_name: transcendence_ingestion
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      # db:
      #   condition: service_healthy
    networks:
      - transcendence_net

